<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Form thông tin</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <form method="POST" action="config.php">
      <table>
        <tr>
          <th colspan="2" class="table_tittle">Enter your information</th>
        </tr>

        <tr>
          <td>Fullname:</td>

          <td>
            <input type="text" name="fullname" />
          </td>
        </tr>

        <tr>
          <td>Address:</td>

          <td>
            <input type="text" name="address" />
          </td>
        </tr>

        <tr>
          <td>Phone:</td>

          <td>
            <input type="text" name="phone" />
          </td>
        </tr>

        <tr>
          <td>Gender:</td>

          <td>
            <input type="radio" name="gender" value="Nam" checked />
            Nam

            <input type="radio" name="gender" value="Nữ" />
            Nữ
          </td>
        </tr>

        <tr>
          <td>Country:</td>

          <td>
            <select name="country">
              <option value="NONE">NONE</option>
              <option value="Việt Nam">VIỆT NAM</option>

              <option value="Mỹ">MỸ</option>

              <option value="Nhật Bản">NHẬT BẢN</option>
            </select>
          </td>
        </tr>

        <tr>
          <td>Study:</td>

          <td>
            <input type="checkbox" name="study[]" value="PHP" />
            PHP

            <input type="checkbox" name="study[]" value="MySQL" />
            MySQL

            <input type="checkbox" name="study[]" value="ASP.NET" />
            ASP.NET

            <input type="checkbox" name="study[]" value="CCNA" />
            CCNA

            <input type="checkbox" name="study[]" value="Security++" />
            Security++
          </td>
        </tr>

        <tr>
          <td>Note:</td>

          <td>
            <textarea name="note" rows="5" cols="35"></textarea>
          </td>
        </tr>

        <tr>
          <td colspan="2" class="center">
            <input type="submit" value="Gửi" />

            <input type="reset" value="Hủy" />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
